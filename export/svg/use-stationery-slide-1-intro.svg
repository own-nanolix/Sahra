<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1600 900" data-export="use-stationery-slide-1-intro" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Slide 1, the intro" style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900"><title>Slide 1, the intro</title><g style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><rect width="1600" height="900" fill="#FFFFFF" style="color:rgb(30, 20, 15);fill:rgb(255, 255, 255);stroke:none;stroke-width:1px;"/><path d="M42 52V126" stroke="#B9B9B9" stroke-width="2" style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:rgb(185, 185, 185);stroke-width:2px;"/><text x="82" y="80" font-size="34" fill="#111111" letter-spacing="-0.4" font-weight="400" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Test Tiempos Text', 'Source Serif 4', 'Iowan Old Style', Georgia, serif;font-size:34px;font-weight:400;letter-spacing:-0.4px;"><tspan x="82" dy="0" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Test Tiempos Text', 'Source Serif 4', 'Iowan Old Style', Georgia, serif;font-size:34px;font-weight:400;letter-spacing:-0.4px;">We Build Spaces</tspan><tspan x="82" dy="35.7" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Test Tiempos Text', 'Source Serif 4', 'Iowan Old Style', Georgia, serif;font-size:34px;font-weight:400;letter-spacing:-0.4px;">of Imagination</tspan></text><text x="475" y="108" font-size="14" fill="#111111" textLength="650" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">When it comes to real estate, the first impression is often one of complexity, rigidity and</text><text x="475" y="126.2" font-size="14" fill="#111111" textLength="650" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">overwhelming choices. However, in contrast to the conventional approach of the market, Sahra</text><text x="475" y="144.4" font-size="14" fill="#111111" textLength="650" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">introduces a refined, human-centered and seamless experience, redefining how people connect</text><text x="475" y="162.6" font-size="14" fill="#111111" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">with spaces.</text><text x="475" y="197.8" font-size="14" fill="#111111" textLength="650" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">This positioning reflects a vision where real estate is not just transactional, but emotional</text><text x="475" y="216" font-size="14" fill="#111111" textLength="650" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">and intentional. Every detail of Sahra's identity and communication is crafted to embody</text><text x="475" y="234.2" font-size="14" fill="#111111" textLength="650" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">clarity, trust and elegance, reinforcing its commitment to shaping meaningful living</text><text x="475" y="252.4" font-size="14" fill="#111111" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">experiences across Saudi Arabia.</text><text x="475" y="287.6" font-size="14" fill="#111111" textLength="650" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">We exist where vision meets reality, connecting people to places that inspire life and</text><text x="475" y="305.8" font-size="14" fill="#111111" textLength="650" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">purpose. We see beyond structures, uncovering potential, creating opportunities and</text><text x="475" y="324" font-size="14" fill="#111111" textLength="650" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">transforming empty spaces into living stories. We are builders of experiences, driven by</text><text x="475" y="342.2" font-size="14" fill="#111111" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">precision, creativity and a deep understanding of what makes a place truly valuable.</text><text x="475" y="377.4" font-size="14" fill="#111111" textLength="650" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">With a clear purpose: to redefine real estate as a journey of discovery, belonging and</text><text x="475" y="395.6" font-size="14" fill="#111111" textLength="650" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">aspiration. We believe that property is more than an asset—it is a foundation for life, growth</text><text x="475" y="413.8" font-size="14" fill="#111111" textLength="650" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">and future possibilities. Through every project, we aim to create environments that empower</text><text x="475" y="432" font-size="14" fill="#111111" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">individuals, elevate lifestyles and contribute to lasting impact.</text><text x="475" y="467.2" font-size="14" fill="#111111" textLength="650" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">More than offering properties, we create connections. We value the trust of those who choose</text><text x="475" y="485.4" font-size="14" fill="#111111" textLength="650" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">Sahra and strive to build relationships rooted in transparency, care and long-term vision. We</text><text x="475" y="503.6" font-size="14" fill="#111111" textLength="650" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">stand beside our clients at every step, understanding their ambitions and guiding them toward</text><text x="475" y="521.8" font-size="14" fill="#111111" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">the right opportunities with confidence and ease.</text><text x="475" y="557" font-size="14" fill="#111111" textLength="650" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">It is in every fulfilled vision, every space brought to life and every story that begins</text><text x="475" y="575.2" font-size="14" fill="#111111" textLength="650" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">within our developments that we find our purpose. We remain committed to shaping environments</text><text x="475" y="593.4" font-size="14" fill="#111111" textLength="650" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">that reflect ambition, inspire progress and redefine the meaning of modern living. Because at</text><text x="475" y="611.6" font-size="14" fill="#111111" lengthAdjust="spacing" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">Sahra, we don't just develop real estate—we create places where life unfolds.</text><g style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><text x="475" y="736" font-size="13.5" fill="#111111" font-weight="400" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;"><tspan x="475" dy="0" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;">Scope of work</tspan></text><text x="691" y="736" font-size="13.5" fill="#111111" font-weight="400" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;"><tspan x="691" dy="0" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;">Positioning / Visual Identity / Art Direction / Brand Communication</tspan></text></g><g style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><text x="475" y="754.4" font-size="13.5" fill="#111111" font-weight="400" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;"><tspan x="475" dy="0" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;">Client</tspan></text><text x="691" y="754.4" font-size="13.5" fill="#111111" font-weight="400" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;"><tspan x="691" dy="0" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;">Sahra Development</tspan></text></g><g style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><text x="475" y="772.8" font-size="13.5" fill="#111111" font-weight="400" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;"><tspan x="475" dy="0" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;">Industry</tspan></text><text x="691" y="772.8" font-size="13.5" fill="#111111" font-weight="400" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;"><tspan x="691" dy="0" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;">Real Estate</tspan></text></g><g style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><text x="475" y="791.2" font-size="13.5" fill="#111111" font-weight="400" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;"><tspan x="475" dy="0" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;">Location</tspan></text><text x="691" y="791.2" font-size="13.5" fill="#111111" font-weight="400" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;"><tspan x="691" dy="0" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;">Riyadh, Saudi Arabia</tspan></text></g><g style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><text x="475" y="809.6" font-size="13.5" fill="#111111" font-weight="400" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;"><tspan x="475" dy="0" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;">Date</tspan></text><text x="691" y="809.6" font-size="13.5" fill="#111111" font-weight="400" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;"><tspan x="691" dy="0" style="color:rgb(30, 20, 15);fill:rgb(17, 17, 17);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;">2026</tspan></text></g></g></svg>