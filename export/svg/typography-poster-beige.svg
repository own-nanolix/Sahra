<svg viewBox="0 0 800 1143" data-export="typography-poster-beige" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Poster on beige: Built around how people live today" style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="1143"><title>Poster on beige: Built around how people live today</title><defs style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><linearGradient id="typography-strip" x1="0" y1="0" x2="1" y2="1" style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><stop offset="0" stop-color="#C99A63" style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;stop-color:rgb(201, 154, 99);"/><stop offset="0.5" stop-color="#A8743F" style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;stop-color:rgb(168, 116, 63);"/><stop offset="1" stop-color="#6B4424" style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;stop-color:rgb(107, 68, 36);"/></linearGradient></defs><rect width="800" height="1143" fill="#F5F0E3" style="color:rgb(30, 20, 15);fill:rgb(245, 240, 227);stroke:none;stroke-width:1px;"/><rect x="610" y="60" width="150" height="1023" fill="url(#typography-strip)" style="color:rgb(30, 20, 15);fill:url(#typography-strip);stroke:none;stroke-width:1px;"/><g style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><text x="56" y="150" font-size="58" letter-spacing="-1.1" fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Test Tiempos Text', 'Source Serif 4', 'Iowan Old Style', Georgia, serif;font-size:58px;font-weight:400;letter-spacing:-1.1px;">Built around</text><text x="56" y="212" font-size="58" letter-spacing="-1.1" fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Test Tiempos Text', 'Source Serif 4', 'Iowan Old Style', Georgia, serif;font-size:58px;font-weight:400;letter-spacing:-1.1px;">how people</text><text x="56" y="274" font-size="58" letter-spacing="-1.1" fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Test Tiempos Text', 'Source Serif 4', 'Iowan Old Style', Georgia, serif;font-size:58px;font-weight:400;letter-spacing:-1.1px;">live today</text></g><g style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><text x="56" y="470" font-size="14" fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">Sahra develops spaces that go beyond structure,</text><text x="56" y="492" font-size="14" fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">focusing on how environments shape everyday life.</text><text x="56" y="514" font-size="14" fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">Through a careful approach to design, proportion</text><text x="56" y="536" font-size="14" fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">and materiality, each project is crafted to offer</text><text x="56" y="558" font-size="14" fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">comfort, continuity and a sense of belonging.</text><text x="56" y="580" font-size="14" fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">Rather than following trends, Sahra prioritizes</text><text x="56" y="602" font-size="14" fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">timeless principles—creating spaces that remain</text><text x="56" y="624" font-size="14" fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">relevant, adaptable and connected to the people</text><text x="56" y="646" font-size="14" fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">who inhabit them.</text></g><g style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><g style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><text x="56" y="920" font-size="12" fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:12px;font-weight:400;letter-spacing:-0.16px;">www.sahra.sa</text><text x="56" y="936.5" font-size="12" fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:12px;font-weight:400;letter-spacing:-0.16px;">@sahra.official</text></g><g style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><text x="224" y="920" font-size="12" fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:12px;font-weight:400;letter-spacing:-0.16px;">+966 55 987 6543</text><text x="224" y="936.5" font-size="12" fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:12px;font-weight:400;letter-spacing:-0.16px;">support@sahra.sa</text><text x="224" y="953" font-size="12" fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:12px;font-weight:400;letter-spacing:-0.16px;">partnerships@sahra.sa</text></g><g style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><text x="392" y="920" font-size="12" fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:12px;font-weight:400;letter-spacing:-0.16px;">Riyadh, Saudi Arabia</text><text x="392" y="936.5" font-size="12" fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:12px;font-weight:400;letter-spacing:-0.16px;">+966 55 123 4567</text><text x="392" y="953" font-size="12" fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:12px;font-weight:400;letter-spacing:-0.16px;">info@sahra.sa</text></g><g transform="translate(56 1010) scale(0.26087)" fill="#875D41" style="color:rgb(30, 20, 15);fill:rgb(135, 93, 65);stroke:none;stroke-width:1px;"><path d="M0 83L0 72.5A72.5 72.5 0 0 1 72.5 0L184 0L184 51L152 83L152 32L72.5 32A40.5 40.5 0 0 0 32 72.5L32 83Z" style="color:rgb(30, 20, 15);fill:rgb(135, 93, 65);stroke:none;stroke-width:1px;"/><path d="M184 118L184 128.5A72.5 72.5 0 0 1 111.5 201L0 201L0 150L32 118L32 169L111.5 169A40.5 40.5 0 0 0 152 128.5L152 118Z" style="color:rgb(30, 20, 15);fill:rgb(135, 93, 65);stroke:none;stroke-width:1px;"/></g></g></svg>