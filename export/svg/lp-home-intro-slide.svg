yadh, Saudi Arabia</tspan></text></g><g transform="translate(284 494)" style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><text fill="#5C4A3E" style="color:rgb(30, 20, 15);fill:rgb(92, 74, 62);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:12.5px;font-weight:400;letter-spacing:-0.16px;">Date</text><text fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:12.5px;font-weight:400;letter-spacing:-0.16px;"><tspan x="0" y="20" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:12.5px;font-weight:400;letter-spacing:-0.16px;">2026</tspan></text></g></g><g transform="translate(720 500) scale(0.152174)" fill="#B58F6B" style="color:rgb(30, 20, 15);fill:rgb(181, 143, 107);stroke:none;stroke-width:1px;"><path d="M0 83L0 72.5A72.5 72.5 0 0 1 72.5 0L184 0L184 51L152 83L152 32L72.5 32A40.5 40.5 0 0 0 32 72.5L32 83Z" style="color:rgb(30, 20, 15);fill:rgb(181, 143, 107);stroke:none;stroke-width:1px;"/><path d="M184 118L184 128.5A72.5 72.5 0 0 1 111.5 201L0 201L0 150L32 118L32 169L111.5 169A40.5 40.5 0 0 0 152 128.5L152 118Z" style="color:rgb(30, 20, 15);fill:rgb(181, 143, 107);stroke:none;stroke-width:1px;"/></g></svg>