<svg viewBox="0 0 800 560" data-export="lp-home-intro-slide" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Intro slide: We Build Spaces of Imagination" style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;filter:drop-shadow(rgba(53, 36, 28, 0.12) 10px 12px 0px);" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="560"><title>Intro slide: We Build Spaces of Imagination</title><rect width="800" height="560" fill="#FFFFFF" style="color:rgb(30, 20, 15);fill:rgb(255, 255, 255);stroke:none;stroke-width:1px;"/><path d="M52 72V220" stroke="#35241C" stroke-opacity="0.35" stroke-width="1.5" style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:rgb(53, 36, 28);stroke-width:1.5px;stroke-opacity:0.35;stroke-dasharray:160px;"/><text font-size="40" fill="#35241C" letter-spacing="-0.8" style="color:rgb(30, 20, 15);fill:rgb(53, 36, 28);stroke:none;stroke-width:1px;font-family:'Test Tiempos Text', 'Source Serif 4', 'Iowan Old Style', Georgia, serif;font-size:40px;font-weight:400;letter-spacing:-0.8px;"><tspan x="76" y="110" style="color:rgb(30, 20, 15);fill:rgb(53, 36, 28);stroke:none;stroke-width:1px;font-family:'Test Tiempos Text', 'Source Serif 4', 'Iowan Old Style', Georgia, serif;font-size:40px;font-weight:400;letter-spacing:-0.8px;">We Build Spaces</tspan><tspan x="76" y="156" style="color:rgb(30, 20, 15);fill:rgb(53, 36, 28);stroke:none;stroke-width:1px;font-family:'Test Tiempos Text', 'Source Serif 4', 'Iowan Old Style', Georgia, serif;font-size:40px;font-weight:400;letter-spacing:-0.8px;">of Imagination</tspan></text><text font-size="13.5" fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;"><tspan x="400" y="104" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;">When it comes to real estate, the first impression</tspan><tspan x="400" y="126" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;">is often one of complexity, rigidity and</tspan><tspan x="400" y="148" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;">overwhelming choices. However, in contrast to the</tspan><tspan x="400" y="170" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;">conventional approach of the market, Sahra</tspan><tspan x="400" y="192" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;">introduces a refined, human-centered and seamless</tspan><tspan x="400" y="214" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;">experience, redefining how people connect with</tspan><tspan x="400" y="236" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13.5px;font-weight:400;letter-spacing:-0.16px;">spaces.</tspan></text><path d="M52 380H748" stroke="#35241C" stroke-opacity="0.3" style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:rgb(53, 36, 28);stroke-width:1px;stroke-opacity:0.3;"/><g font-size="12.