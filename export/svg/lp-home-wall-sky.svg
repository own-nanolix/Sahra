ont-weight:400;letter-spacing:-0.16px;"><tspan x="214" y="258" style="color:rgb(30, 20, 15);fill:rgb(245, 240, 227);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:7px;font-weight:400;letter-spacing:-0.16px;">Sahra develops spaces that go beyond structure,</tspan><tspan x="214" y="267" style="color:rgb(30, 20, 15);fill:rgb(245, 240, 227);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:7px;font-weight:400;letter-spacing:-0.16px;">focusing on how environments shape everyday life.</tspan><tspan x="214" y="276" style="color:rgb(30, 20, 15);fill:rgb(245, 240, 227);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:7px;font-weight:400;letter-spacing:-0.16px;">Through a careful approach to design, proportion</tspan><tspan x="214" y="285" style="color:rgb(30, 20, 15);fill:rgb(245, 240, 227);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:7px;font-weight:400;letter-spacing:-0.16px;">and materiality, each project is crafted to offer</tspan><tspan x="214" y="294" style="color:rgb(30, 20, 15);fill:rgb(245, 240, 227);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:7px;font-weight:400;letter-spacing:-0.16px;">comfort, continuity and a sense of belonging.</tspan><tspan x="214" y="303" style="color:rgb(30, 20, 15);fill:rgb(245, 240, 227);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:7px;font-weight:400;letter-spacing:-0.16px;">Rather than following trends, Sahra prioritizes</tspan><tspan x="214" y="312" style="color:rgb(30, 20, 15);fill:rgb(245, 240, 227);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:7px;font-weight:400;letter-spacing:-0.16px;">timeless principles—creating spaces that remain</tspan><tspan x="214" y="321" style="color:rgb(30, 20, 15);fill:rgb(245, 240, 227);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:7px;font-weight:400;letter-spacing:-0.16px;">relevant, adaptable and connected to the people</tspan><tspan x="214" y="330" style="color:rgb(30, 20, 15);fill:rgb(245, 240, 227);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:7px;font-weight:400;letter-spacing:-0.16px;">who inhabit them.</tspan></text><text font-size="7" fill="#F5F0E3" style="color:rgb(30, 20, 15);fill:rgb(245, 240, 227);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:7px;font-weight:400;letter-spacing:-0.16px;"><tspan x="277" y="467" style="color:rgb(30, 20, 15);fill:rgb(245, 240, 227);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:7px;font-weight:400;letter-spacing:-0.16px;">www.sahra.sa</tspan><tspan x="277" y="477" style="color:rgb(30, 20, 15);fill:rgb(245, 240, 227);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:7px;font-weight:400;letter-spacing:-0.16px;">@sahra.official</tspan><tspan x="277" y="515" style="color:rgb(30, 20, 15);fill:rgb(245, 240, 227);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:7px;font-weight:400;letter-spacing:-0.16px;">+966 55 987 6543</tspan><tspan x="277" y="525" style="color:rgb(30, 20, 15);fill:rgb(245, 240, 227);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:7px;font-weight:400;letter-spacing:-0.16px;">support@sahra.sa</tspan><tspan x="277" y="535" style="color:rgb(30, 20, 15);fill:rgb(245, 240, 227);stroke:none;stroke-width:1px;f