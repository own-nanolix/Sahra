;flood-color:rgb(0, 0, 0);"><feMergeNode in="SourceGraphic" style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;flood-color:rgb(0, 0, 0);"/><feMergeNode in="gi" style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;flood-color:rgb(0, 0, 0);"/></feMerge></filter></defs><rect x="0" y="0" width="600" height="840" fill="url(#lp-vision-pl-sky)" style="color:rgb(30, 20, 15);fill:url(#lp-vision-pl-sky);stroke:none;stroke-width:1px;"/><path d="M0 319.2Q270 151.2 468 201.6L468 840H0Z" fill="url(#lp-vision-pl-wall)" filter="url(#lp-vision-pl-grain)" style="color:rgb(30, 20, 15);fill:url(#lp-vision-pl-wall);stroke:none;stroke-width:1px;filter:url(#lp-vision-pl-grain);"/><path d="M468 0H600V840H468Z" fill="#2A1C15" style="color:rgb(30, 20, 15);fill:rgb(42, 28, 21);stroke:none;stroke-width:1px;"/><path d="M0 604.8L468 420V840H0Z" fill="#2A1C15" opacity="0.82" style="color:rgb(30, 20, 15);fill:rgb(42, 28, 21);stroke:none;stroke-width:1px;opacity:0.82;"/></g></g><text font-size="45" letter-spacing="-0.6" fill="#F5F0E3" style="color:rgb(30, 20, 15);fill:rgb(245, 240, 227);stroke:none;stroke-width:1px;font-family:'Test Tiempos Text', 'Source Serif 4', 'Iowan Old Style', Georgia, serif;font-size:45px;font-weight:400;letter-spacing:-0.6px;"><tspan x="36" y="67" style="color:rgb(30, 20, 15);fill:rgb(245, 240, 227);stroke:none;stroke-width:1px;font-family:'Test Tiempos Text', 'Source Serif 4', 'Iowan Old Style', Georgia, serif;font-size:45px;font-weight:400;letter-spacing:-0.6px;">We Build Spaces</tspan><tspan x="36" y="110" style="color:rgb(30, 20, 15);fill:rgb(245, 240, 227);stroke:none;stroke-width:1px;font-family:'Test Tiempos Text', 'Source Serif 4', 'Iowan Old Style', Georgia, serif;font-size:45px;font-weight:400;letter-spacing:-0.6px;">of Imagination</tspan></text><g style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><text font-size="10.4" fill="#E8DFD0" style="color:rgb(30, 20, 15);fill:rgb(232, 223, 208);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:10.4px;font-weight:400;letter-spacing:-0.16px;"><tspan x="287" y="330" style="color:rgb(30, 20, 15);fill:rgb(232, 223, 208);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:10.4px;font-weight:400;letter-spacing:-0.16px;">Sahra develops spaces that go beyond structure, focusing on</tspan><tspan x="287" y="344.6" style="color:rgb(30, 20, 15);fill:rgb(232, 223, 208);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:10.4px;font-weight:400;letter-spacing:-0.16px;">how environments shape everyday life. Through a careful</tspan><tspan x="287" y="359.2" style="color:rgb(30, 20, 15);fill:rgb(232, 223, 208);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:10.4px;font-weight:400;letter-spacing:-0.16px;">approach to design, proportion and materiality, each project</tspan><tspan x="287" y="373.8" style="color:rgb(30, 20, 15);fill:rgb(232, 223, 208);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:10.4px;font-weight:400;letter-spacing:-0.16px;">is crafted to offer comfort, continuity and a sense of</tspan><tspan x="287" y="388.4" style="color:rgb(30, 20, 15);fill:rgb(232, 223, 208);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:10.4px;font-weight:400;letter-spacing:-0.16px;">belonging. Rather than following trends, Sahra prioritizes</tspan><tspan x="287" y="403" style="color:rgb(30, 20, 15);fill:rgb(232, 223, 208);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:10.4px;font-weight:400;letter-spacing:-0.16px;">timeless principles—creating spaces that remain relevant,</tspan><tspan x="287" y="417.6" style="color:rgb(30, 20, 15);fill:rgb(232, 223, 208);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:10.4px;font-weight:400;letter-spacing:-0.16px;">adaptable and connected to the people who inhabit them.</tspan></text><text font-size="9.8" fill="#E8DFD0" style="color:rgb(30, 20, 15);fill:rgb(232, 223, 208);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:9.8px;font-weight:400;letter-spacing:-0.16px;"><tspan x="385" y="637" style="color:rgb(30, 20, 15);fill:rgb(232, 223, 208);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:9.8px;font-weight:400;letter-spacing:-0.16px;">www.sahra.sa</tspan><tspan x="385" y="650.8" style="color:rgb(30, 20, 15);fill:rgb(232, 223, 208);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:9.8px;font-weight:400;letter-spacing:-0.16px;">@sahra.official</tspan></text><text font-size="9.8" fill="#E8DFD0" style="color:rgb(30, 20, 15);fill:rgb(232, 223, 208);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:9.8px;font-weight:400;letter-spacing:-0.16px;"><tspan x="385" y="703" style="color:rgb(30, 20, 15);fill:rgb(232, 223, 208);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:9.8px;font-weight:400;letter-spacing:-0.16px;">+966 55 987 6543</tspan><tspan x="385" y="716.8" style="color:rgb(30, 20, 15);fill:rgb(232, 223, 208);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:9.8px;font-weight:400;letter-spacing:-0.16px;">support@sahra.sa</tspan><tspan x="385" y="730.6" style="color:rgb(30, 20, 15);fill:rgb(232, 223, 208);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:9.8px;font-weight:400;letter-spacing:-0.16px;">partnerships@sahra.sa</tspan></text><text font-size="9.8" fill="#E8DFD0" style="color:rgb(30, 20, 15);fill:rgb(232, 223, 208);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:9.8px;font-weight:400;letter-spacing:-0.16px;"><tspan x="385" y="770" style="color:rgb(30, 20, 15);fill:rgb(232, 223, 208);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:9.8px;font-weight:400;letter-spacing:-0.16px;">Riyadh, Saudi Arabia</tspan><tspan x="385" y="783.8" style="color:rgb(30, 20, 15);fill:rgb(232, 223, 208);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:9.8px;font-weight:400;letter-spacing:-0.16px;">+966 55 123 4567</tspan><tspan x="385" y="797.6" style="color:rgb(30, 20, 15);fill:rgb(232, 223, 208);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:9.8px;font-weight:400;letter-spacing:-0.16px;">info@sahra.sa</tspan></text></g><g style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><g style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><rect x="0" y="700" width="260" height="140" fill="#2A1C15" style="color:rgb(30, 20, 15);fill:rgb(42, 28, 21);stroke:none;stroke-width:1px;"/><path d="M0 840V812H52V784H104V756H156V728H208V700H260V840Z" fill="#3A2A20" style="color:rgb(30, 20, 15);fill:rgb(58, 42, 32);stroke:none;stroke-width:1px;"/></g></g><g transform="translate(36 746) scale(0.288043)" fill="#B58F6B" style="color:rgb(30, 20, 15);fill:rgb(181, 143, 107);stroke:none;stroke-width:1px;"><path d="M0 83L0 72.5A72.5 72.5 0 0 1 72.5 0L184 0L184 51L152 83L152 32L72.5 32A40.5 40.5 0 0 0 32 72.5L32 83Z" style="color:rgb(30, 20, 15);fill:rgb(181, 143, 107);stroke:none;stroke-width:1px;"/><path d="M184 118L184 128.5A7