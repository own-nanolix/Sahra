 system-ui, sans-serif;font-size:5.6px;font-weight:400;letter-spacing:-0.16px;">organization of spaces prioritizes openness, proportion and seamless transitions between areas,</tspan><tspan x="252" y="709.4" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:5.6px;font-weight:400;letter-spacing:-0.16px;">ensuring both comfort and efficiency. Every plan is carefully structured to maximize usability</tspan><tspan x="252" y="718.2" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:5.6px;font-weight:400;letter-spacing:-0.16px;">while maintaining a refined architectural rhythm that enhances the overall living experience.</tspan></text></svg>