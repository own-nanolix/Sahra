if 4', 'Iowan Old Style', Georgia, serif;font-size:34px;font-weight:400;letter-spacing:-0.4px;">Built with intention,</tspan><tspan x="24" y="245" style="color:rgb(30, 20, 15);fill:rgb(53, 36, 28);stroke:none;stroke-width:1px;font-family:'Test Tiempos Text', 'Source Serif 4', 'Iowan Old Style', Georgia, serif;font-size:34px;font-weight:400;letter-spacing:-0.4px;">designed for life</tspan><tspan x="24" y="280" style="color:rgb(30, 20, 15);fill:rgb(53, 36, 28);stroke:none;stroke-width:1px;font-family:'Test Tiempos Text', 'Source Serif 4', 'Iowan Old Style', Georgia, serif;font-size:34px;font-weight:400;letter-spacing:-0.4px;">beyond structure.</tspan></text><text font-size="13" fill="#35241C" style="color:rgb(30, 20, 15);fill:rgb(53, 36, 28);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13px;font-weight:400;letter-spacing:-0.16px;"><tspan x="24" y="322" style="color:rgb(30, 20, 15);fill:rgb(53, 36, 28);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13px;font-weight:400;letter-spacing:-0.16px;">Sahra approaches real estate as a long-term</tspan><tspan x="24" y="346" style="color:rgb(30, 20, 15);fill:rgb(53, 36, 28);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13px;font-weight:400;letter-spacing:-0.16px;">vision, where architecture is shaped by how</tspan><tspan x="24" y="370" style="color:rgb(30, 20, 15);fill:rgb(53, 36, 28);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13px;font-weight:400;letter-spacing:-0.16px;">people live, not just how spaces look. Every</tspan><tspan x="24" y="394" style="color:rgb(30, 20, 15);fill:rgb(53, 36, 28);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13px;font-weight:400;letter-spacing:-0.16px;">development r