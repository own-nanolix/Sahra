="34" font-weight="500" fill="#35241C" letter-spacing="-0.4" style="color:rgb(30, 20, 15);fill:rgb(53, 36, 28);stroke:none;stroke-width:1px;font-family:'Test Tiempos Text', 'Source Serif 4', 'Iowan Old Style', Georgia, serif;font-size:34px;font-weight:500;letter-spacing:-0.4px;"><tspan x="24" y="210" style="color:rgb(30, 20, 15);fill:rgb(53, 36, 28);stroke:none;stroke-width:1px;font-family:'Test Tiempos Text', 'Source Serif 4', 'Iowan Old Style', Georgia, serif;font-size:34px;font-weight:500;letter-spacing:-0.4px;">Built with intention,</tspan><tspan x="24" y="245" style="color:rgb(30, 20, 15);fill:rgb(53, 36, 28);stroke:none;stroke-width:1px;font-family:'Test Tiempos Text', 'Source Serif 4', 'Iowan Old Style', Georgia, serif;font-size:34px;font-weight:500;letter-spacing:-0.4px;">designed for life</tspan><tspan x="24" y="280" style="color:rgb(30, 20, 15);fill:rgb(53, 36, 28);stroke:none;stroke-width:1px;font-family:'Test Tiempos Text', 'Source Serif 4', 'Iowan Old Style', Georgia, serif;font-size:34px;font-weight:500;letter-spacing:-0.4px;">beyond structure.</tspan></text><text font-size="13" fill="#1E140F" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13px;font-weight:400;letter-spacing:-0.16px;"><tspan x="24" y="322" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13px;font-weight:400;letter-spacing:-0.16px;">Sahra approaches real estate as a long-term</tspan><tspan x="24" y="346" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13px;font-weight:400;letter-spacing:-0.16px;">vision, where architecture is shaped by how</tspan><tspan x="24" y="370" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13px;font-weight:400;letter-spacing:-0.16px;">people live, not just how spaces look. Every</tspan><tspan x="24" y="394" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13px;font-weight:400;letter-spacing:-0.16px;">development reflects a balance between</tspan><tspan x="24" y="418" style="color:rgb(30, 20, 15);fill:rgb(30, 20, 15);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13px;font-weight:400;letter-spacing:-0.16px;">clarity, function and refined design.</tspan></text><g transform="translate(24 480)" style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><path d="M0 0H342" stroke="rgba(53, 36, 28, 0.4)" stroke-width="1" style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:rgba(53, 36, 28, 0.4);stroke-width:1px;"/><text x="0" y="56" font-size="14" fill="#35241C" style="color:rgb(30, 20, 15);fill:rgb(53, 36, 28);stroke:none;stroke-width:1px;font-family:'Inter Tight', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;letter-spacing:-0.16px;">01</text><text x="57" y="56" font-size="18" fill="#35241C" style="color:rgb(30, 20, 15);fill:rgb(53, 36, 28);stroke:none;stroke-width:1px;font-family:'Test Tiempos Text', 'Source Serif 4', 'Iowan Old Style', Georgia, serif;font-size:18px;font-weight:400;letter-spacing:-0.16px;">Philosophy</text><path d="M326 50h10M331 45v10" stroke="#35241C" stroke-width="1" style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:rgb(53, 36, 28);stroke-width:1px;"/></g><g transform="translate(24 579)" style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><path d="M0 0H342" stroke="rgba(53, 36, 28, 0.4)" stroke-width="1" style="color:rgb(30, 20, 15);fill:rgb(0, 0, 0);stroke:rgba(53, 36, 28, 0.4);stroke-width:1px;"